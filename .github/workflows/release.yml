name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release Tarball
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GitHub macOS-15 runners ship Swift 6.0 by default. Steno's
      # `daemon/Package.swift` declares swift-tools-version: 6.2 and
      # the daemon imports `SpeechAnalyzer` from the macOS 26 SDK, so
      # the runner will refuse to build until macOS 26 + Xcode 26
      # land on the hosted images. Until then the build step here
      # surfaces a loud failure — preferable to silently producing a
      # non-functional artifact built against a stale SDK.
      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Print toolchain versions
        run: |
          swift --version
          go version

      # Fail before building if the tag and VERSION disagree — otherwise a
      # `v0.6.0` tag publishes binaries that report the previous version,
      # which is the bug this whole change exists to prevent (#92).
      - name: Check VERSION matches the tag
        run: make check-release-tag TAG="${GITHUB_REF_NAME}"

      - name: Build daemon + steno (release)
        run: make build

      - name: Ad-hoc sign daemon
        run: make sign-daemon

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/steno-${TAG}-macos-arm64"
          mkdir -p "${STAGE}/bin"
          # Both binaries land side-by-side under `bin/`. The Homebrew
          # formula's `bin.install` step picks them up the same way.
          cp daemon/.build/release/steno-daemon "${STAGE}/bin/steno-daemon"
          cp cmd/steno/steno "${STAGE}/bin/steno"
          # Include README + LICENSE so users untarring outside brew
          # have the basics on hand.
          cp README.md "${STAGE}/"
          if [ -f LICENSE ]; then cp LICENSE "${STAGE}/"; fi
          cd dist
          tar -czf "steno-${TAG}-macos-arm64.tar.gz" "steno-${TAG}-macos-arm64"
          shasum -a 256 "steno-${TAG}-macos-arm64.tar.gz" \
            | tee "steno-${TAG}-macos-arm64.tar.gz.sha256"
          echo "tarball=dist/steno-${TAG}-macos-arm64.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "sha256_file=dist/steno-${TAG}-macos-arm64.tar.gz.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: steno-${{ github.ref_name }}-macos-arm64
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha256_file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha256_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
